# MODELO — copie este arquivo para "postgres-secret.yaml" e preencha com valores
# reais antes de aplicar no cluster. O arquivo "postgres-secret.yaml" (sem
# "example") é ignorado pelo git de propósito (veja .gitignore) para nunca
# vazar credenciais reais no repositório.
#
# Em produção real, isso deveria vir de um cofre de segredos
# (ex: SealedSecrets, External Secrets Operator) em vez de ficar em texto puro num arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: backstage
type: Opaque
stringData:
  POSTGRES_USER: backstage
  POSTGRES_PASSWORD: troque-esta-senha
  POSTGRES_DB: backstage
